# Render Blueprint: https://render.com/docs/blueprint-spec
# In Render: New + > Blueprint > pick this repository.
services:
  - type: web
    name: dnscope
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DNSCOPE_SEED_DEMO       # fill an empty database with SIMULATED demo data on start-up
        value: "1"
      - key: DNSCOPE_RESOLVER_MODE   # live = real DNS queries
        value: live
      - key: ANTHROPIC_API_KEY       # optional; enter it in the Render dashboard, never in this file
        sync: false
